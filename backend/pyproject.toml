[project]
name = "fh-planner-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "statsmodels>=0.14", "yfinance>=0.2", "mftool>=3.0", "beautifulsoup4>=4.12", "boto3>=1.34",
  "fastapi>=0.110", "uvicorn>=0.29", "pydantic>=2.6", "numpy>=1.26", "pandas>=2.2",
  "pyyaml>=6", "pillow>=10", "reportlab>=4.1", "pypdf>=4", "openpyxl>=3.1", "matplotlib>=3.8", "python-dotenv>=1.0",
  "scipy>=1.12", "pyportfolioopt>=1.5", "casparser>=1.4", "python-multipart>=0.0.9",
  "chromadb>=0.5.0", "fastembed>=0.3.0", "litellm>=1.35.0",
  "sqlalchemy>=2.0", "alembic>=1.13", "psycopg[binary]>=3.1",
]
[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "httpx>=0.27", "ruff>=0.4"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
[tool.ruff]
line-length = 120
[tool.ruff.lint]
select = ["E", "F", "I", "W", "B"]
ignore = ["E501", "B905", "B007", "E731"]

[dependency-groups]
workers = ["fastapi", "pydantic", "python-multipart", "pyyaml"]
