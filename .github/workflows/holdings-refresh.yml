name: Monthly Holdings Refresh

# Ingests AMC monthly portfolio disclosures into data/mf_holdings/
# (committed snapshot CSVs + manifest). Disclosures are due by the 10th
# of the following month, so this runs on the 15th for the month just
# ended. The script defaults to the previous month.
#
# FULLY AUTOMATED — no manual trigger, by standing rule: no manual
# workflows in website operations.
#
# The commit touches data/**, which triggers the API deploy workflow,
# so the refreshed snapshot ships to the EC2 backend with the deploy.
# Public sources only, rate limited; a wall for one fund is recorded in
# the run log, never worked around. Zero matched schemes fails the job.

on:
  schedule:
    # 03:00 UTC on the 15th of each month
    - cron: '0 3 15 * *'

permissions:
  contents: write

concurrency:
  group: holdings-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ingest dependencies
        run: pip install openpyxl

      - name: Ingest holdings
        run: python backend/scripts/ingest_holdings.py

      - name: Commit refreshed snapshot
        run: |
          git config user.name "fh-data-bot"
          git config user.email "fh-data-bot@users.noreply.github.com"
          git add data/mf_holdings/
          git diff --cached --quiet || (git commit -m "data: monthly mutual fund holdings refresh" && git pull --rebase origin main && git push)
