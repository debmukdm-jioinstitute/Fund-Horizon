name: Daily Data Refresh

on:
  schedule:
    # 18:30 UTC weekdays (midnight 00:00 IST after AMFI daily NAV releases)
    - cron: '30 18 * * 1-5'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run mode (no database writes)'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write

concurrency:
  group: daily-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Rebuild mutual fund returns from AMFI + mfapi.in
        if: ${{ inputs.dry_run != true }}
        run: |
          pip install pandas numpy
          python data/fundhorizon_mf_rag_dataset/build_dataset.py "$RUNNER_TEMP/mf" --workers 12 --include-direct
          # Guard: a half-failed fetch must never replace the good dataset.
          old=$(($(wc -l < data/fundhorizon_mf_rag_dataset/all_schemes_metrics.csv)))
          new=$(($(wc -l < "$RUNNER_TEMP/mf/all_schemes_metrics.csv")))
          if [ "$new" -lt $((old * 9 / 10)) ]; then echo "New dataset too small ($new vs $old rows)"; exit 1; fi
          # nav_monthly must move together with the CSV: every scheme in it needs its NAV history file.
          cp "$RUNNER_TEMP/mf/all_schemes_metrics.csv" "$RUNNER_TEMP/mf/category_summary.csv" data/fundhorizon_mf_rag_dataset/
          cp "$RUNNER_TEMP/mf/nav_monthly/"*.csv data/fundhorizon_mf_rag_dataset/nav_monthly/

      - name: Run data refresh orchestrator
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python backend/scripts/refresh_data.py --dry-run
          else
            python backend/scripts/refresh_data.py
          fi

      - name: Commit refreshed dataset so deploys pick it up
        if: ${{ inputs.dry_run != true }}
        run: |
          git config user.name "fh-data-bot"
          git config user.email "fh-data-bot@users.noreply.github.com"
          git add data/fundhorizon_mf_rag_dataset/all_schemes_metrics.csv data/fundhorizon_mf_rag_dataset/category_summary.csv data/fundhorizon_mf_rag_dataset/nav_monthly
          git diff --cached --quiet || (git commit -m "data: daily mutual fund metrics refresh" && git push)
