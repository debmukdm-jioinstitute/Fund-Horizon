name: Daily Data Refresh

on:
  schedule:
    # 18:30 UTC weekdays (midnight 00:00 IST after AMFI daily NAV releases)
    - cron: '30 18 * * 1-5'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run mode (no database writes)'
        required: false
        default: 'false'
        type: boolean

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run data refresh orchestrator
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python backend/scripts/refresh_data.py --dry-run
          else
            python backend/scripts/refresh_data.py
          fi
