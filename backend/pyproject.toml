[project]
name = "fh-planner-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110", "uvicorn>=0.29", "pydantic>=2.6", "numpy>=1.26", "pandas>=2.2",
  "pyyaml>=6", "reportlab>=4.1", "matplotlib>=3.8", "python-dotenv>=1.0",
]
[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "httpx>=0.27", "ruff>=0.4"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
[tool.ruff]
line-length = 100
