# Composite score weights (percentile ranks within category)
growth:   # equity / hybrid / gold
  cagr_5y_or_3y: 0.35
  roll3y_median: 0.25
  sharpe_3y: 0.20
  neg_abs_max_drawdown_3y: 0.20
income:   # liquid / overnight / money market / short duration
  cagr_3y: 0.40
  roll1y_median: 0.30
  neg_vol_3y: 0.30
income_categories: [liquid, overnight, money_market, short_duration]

# Category ranking weights incorporating consistency (rolling % positive, dispersion)
category_ranking:
  growth:
    cagr_5y_or_3y: 0.25
    roll3y_median: 0.20
    roll3y_pct_positive: 0.15
    neg_roll3y_dispersion: 0.15
    sharpe_3y: 0.15
    neg_abs_max_drawdown_3y: 0.10
  income:
    cagr_3y: 0.30
    roll1y_median: 0.25
    roll1y_pct_positive: 0.25
    neg_vol_3y: 0.20
