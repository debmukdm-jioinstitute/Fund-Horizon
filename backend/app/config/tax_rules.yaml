# Indian personal income-tax rules used by the planner. Resident individuals only.
# TODO(owner-ca-review): every value below was compiled from secondary sources in October 2026
# (see `sources`). `verified` stays false until a chartered accountant signs off. Update once a
# year after the Union Budget, then re-run `make test`. Amounts are rupees; rates are decimals.
fy: "2026-27"
ay: "2027-28"
as_of: "2026-10"
verified: false
cess: 0.04

sources:
  - name: "Mutual fund taxation snapshot 2026-27 (ICICI Prudential AMC, per Finance Act 2026)"
    url: "https://www.icicipruamc.com/blob/knowledgecentre/tax_reckoner/Tax%20Reckoner%202026-27.pdf"
  - name: "Income tax slabs FY 2026-27 (BusinessToday, Budget 2026 summary)"
    url: "https://www.businesstoday.in/personal-finance/tax/story/tax-slabs-fy-2026-27-what-budget-2026-changed-for-individual-taxpayers-and-which-regime-works-best-514044-2026-02-01"
  - name: "Small savings rates, Oct-Dec 2026 (Business Today, 30 Sep 2026 notification)"
    url: "https://www.businesstoday.in/personal-finance/story/small-savings-scheme-interest-rates-unchanged-for-q3-fy27-check-ppf-scss-ssy-rates-558892-2026-09-30"
  - name: "Section 80C is now Section 123 (BusinessToday)"
    url: "https://www.businesstoday.in/personal-finance/tax/story/income-tax-act-2025-section-80c-becomes-section-123-from-april-1-2026-heres-what-taxpayers-must-know-522120-2026-03-24"
  - name: "Income Tax Department rate pages"
    url: "https://incometaxindia.gov.in"

new_regime:
  std_deduction: 75000
  # (upper bound of band, rate). null = no upper bound.
  slabs: [[400000, 0.0], [800000, 0.05], [1200000, 0.10], [1600000, 0.15], [2000000, 0.20], [2400000, 0.25], [null, 0.30]]
  rebate: {income_limit: 1200000, max: 60000}     # section 87A, with marginal relief just above the limit
  surcharge: [[5000000, 0.0], [10000000, 0.10], [20000000, 0.15], [null, 0.25]]

old_regime:
  std_deduction: 50000
  slabs:
    general:      [[250000, 0.0], [500000, 0.05], [1000000, 0.20], [null, 0.30]]
    senior:       [[300000, 0.0], [500000, 0.05], [1000000, 0.20], [null, 0.30]]   # age 60 to 79
    super_senior: [[500000, 0.0], [1000000, 0.20], [null, 0.30]]                   # age 80 and above
  rebate: {income_limit: 500000, max: 12500}
  surcharge: [[5000000, 0.0], [10000000, 0.10], [20000000, 0.15], [50000000, 0.25], [null, 0.37]]

limits:
  sec_80c: 150000
  sec_80ccd_1b: 50000
  employer_nps_pct_new: 0.14          # of basic + DA, both employer types, new regime
  employer_nps_pct_old_govt: 0.14
  employer_nps_pct_old_other: 0.10
  sec_80d_self: 25000
  sec_80d_self_senior: 50000
  sec_80d_parents: 25000
  sec_80d_parents_senior: 50000
  sec_80d_max: 100000
  sec_24b_self_occupied: 200000
  sec_80tta: 10000
  sec_80ttb: 50000
  hra_metro_pct: 0.50
  hra_other_pct: 0.40
  hra_basic_share_rent: 0.10
  employer_contribution_cap: 750000   # PF + NPS + superannuation, taxable above this
  rebate_cliff_note_band: 100000      # warn when taxable income is within this much of the 87A limit

capital_gains:
  equity_holding_months: 12
  equity_ltcg: 0.125
  equity_stcg: 0.20
  equity_ltcg_exemption: 125000
  nonequity_ltcg: 0.125
  nonequity_holding_months: 24        # gold / international fund-of-funds; ETFs use 12
  etf_holding_months: 12

tds:
  fd_interest_threshold: 50000
  fd_interest_threshold_senior: 100000

small_savings:                        # Oct-Dec 2026 quarter; PPF/SSY reset quarterly, SCSS locks at opening
  as_of: "2026-Q3-FY27"
  ppf: {rate: 0.071, lock_in_years: 15}
  ssy: {rate: 0.082, lock_in_years: 21}
  nsc: {rate: 0.077, lock_in_years: 5}
  scss: {rate: 0.082, lock_in_years: 5}
  kvp: {rate: 0.075, lock_in_years: 9.6}
  mis: {rate: 0.074, lock_in_years: 5}
  post_office_td_5y: {rate: 0.075, lock_in_years: 5}

# IT Act 2025 section numbers appear only where several secondary sources agree.
# Legacy labels (80C ...) stay primary because that is what customers and employers still say.
section_labels:
  "80C": {legacy: "Section 80C", new_act: "Section 123", agreed: true}
  "80D": {legacy: "Section 80D", new_act: "Section 126", agreed: true}
  "80CCD": {legacy: "Section 80CCD", new_act: "Section 124", agreed: true}
  "80CCD1B": {legacy: "Section 80CCD(1B)", new_act: "Section 124", agreed: false}
  "80CCD2": {legacy: "Section 80CCD(2)", new_act: "Section 124", agreed: false}
  "24B": {legacy: "Section 24(b)", new_act: null, agreed: false}
  "87A": {legacy: "Section 87A", new_act: null, agreed: false}
  "80TTB": {legacy: "Section 80TTB", new_act: null, agreed: false}
  "HRA": {legacy: "HRA exemption", new_act: null, agreed: false}
