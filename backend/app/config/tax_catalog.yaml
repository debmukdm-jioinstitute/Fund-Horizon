# Plain-English catalog of savings and investment instruments, with how each is taxed (FY 2026-27).
# Educational only. TODO(owner-ca-review): confirm tax treatment and rates before wide release.
# Wording rules: no "best", "guaranteed", "advice", "advisory", "recommend", "suggested" (scanned by tests).
as_of: "2026-10"
fy: "2026-27"
kinds:
  govt_scheme: "Government small savings"
  retirement: "Retirement"
  insurance: "Insurance"
  mutual_fund: "Mutual funds"
  bank: "Bank and post office"
  bond: "Bonds"
  market: "Markets and property"

instruments:
  - id: ppf
    name: "Public Provident Fund (PPF)"
    kind: govt_scheme
    summary: "A 15-year government savings account with an interest rate set every quarter. Deposits up to 1.5 lakh a year."
    who_for: "Long goals such as retirement or a child's education, for people who want sovereign-backed, steady growth."
    lock_in: "15 years, with partial withdrawal from year 7 and extensions in 5-year blocks."
    risk: "Very low"
    liquidity: "Low"
    return_note: "7.1% a year for Oct-Dec 2026; resets every quarter."
    tax_in: "Deposits count toward the 1.5 lakh limit of Section 80C (old regime only)."
    tax_on_growth: "Interest is tax free."
    tax_on_exit: "Maturity amount is tax free."
    tax_label: "EEE (exempt at every stage)"
    regime_benefit: old
    section: "80C"
    min_horizon_years: 10
    goal_types: [retirement, child_education, child_marriage]
    watch_outs:
      - "Rate can fall in later quarters."
      - "Under the new regime the deposit gets no deduction, but growth and maturity stay tax free."
      - "Missing the yearly minimum deposit freezes the account until you pay a small penalty."

  - id: epf_vpf
    name: "Employees' Provident Fund (EPF) and Voluntary PF (VPF)"
    kind: retirement
    summary: "Your salary-linked retirement fund. VPF lets you add more than the compulsory 12% at the same rate."
    who_for: "Salaried employees who want low-risk retirement saving through payroll."
    lock_in: "Until retirement, with limited withdrawals for specific needs."
    risk: "Very low"
    liquidity: "Low"
    return_note: "Rate is declared by the EPFO each year; check the latest declared rate."
    tax_in: "Your contribution counts toward Section 80C (old regime only)."
    tax_on_growth: "Interest is tax free up to your own contribution of 2.5 lakh a year; interest on the excess is taxable."
    tax_on_exit: "Tax free after 5 years of continuous service."
    tax_label: "EEE up to the 2.5 lakh yearly limit"
    regime_benefit: old
    section: "80C"
    min_horizon_years: 5
    goal_types: [retirement]
    watch_outs:
      - "Withdrawing before 5 years of service can attract tax."
      - "Large VPF top-ups above 2.5 lakh a year lose the tax-free interest."

  - id: nps_tier1
    name: "National Pension System (NPS) Tier 1"
    kind: retirement
    summary: "A market-linked retirement account with a mix of equity, corporate bonds and government securities that you choose."
    who_for: "People who can leave money untouched until 60 and want a low-cost, disciplined retirement build."
    lock_in: "Until age 60, with limited partial withdrawals."
    risk: "Medium (depends on the equity share you choose)"
    liquidity: "Very low"
    return_note: "Market-linked; no fixed rate."
    tax_in: "Own contribution: extra 50,000 deduction under Section 80CCD(1B), over and above the 1.5 lakh limit (old regime only)."
    tax_on_growth: "No tax while invested."
    tax_on_exit: "Up to 60% of the corpus can be taken tax free; the rest must buy an annuity, and annuity income is taxable."
    tax_label: "Deduction on entry, mostly tax free on exit"
    regime_benefit: old
    section: "80CCD1B"
    min_horizon_years: 10
    goal_types: [retirement]
    watch_outs:
      - "Money is locked until 60; do not use it for goals before then."
      - "Annuity income is taxed at your slab rate."
      - "The deduction for your own contribution is not available under the new regime."

  - id: nps_employer
    name: "Employer NPS contribution (Section 80CCD(2))"
    kind: retirement
    summary: "Your employer pays part of your pay into NPS. It reduces taxable salary under both regimes."
    who_for: "Salaried employees whose employer offers a corporate NPS option."
    lock_in: "Until age 60."
    risk: "Medium"
    liquidity: "Very low"
    return_note: "Market-linked."
    tax_in: "Deduction up to 14% of basic plus DA under the new regime (old regime: 14% for government employers, 10% otherwise). Not part of the 1.5 lakh limit."
    tax_on_growth: "No tax while invested."
    tax_on_exit: "Same as NPS Tier 1."
    tax_label: "Deduction in both regimes"
    regime_benefit: both
    section: "80CCD2"
    min_horizon_years: 10
    goal_types: [retirement]
    watch_outs:
      - "Employer PF, NPS and superannuation together above 7.5 lakh a year are taxed as a perquisite."
      - "Needs your employer to offer the option; ask HR."

  - id: elss
    name: "Equity Linked Savings Scheme (ELSS)"
    kind: mutual_fund
    summary: "An equity mutual fund with a mandatory 3-year lock-in on every instalment."
    who_for: "Long goals (5 years or more) for people who accept market ups and downs and want an 80C option."
    lock_in: "3 years per instalment (each SIP instalment has its own 3-year clock)."
    risk: "High"
    liquidity: "Medium after the lock-in"
    return_note: "Market-linked; no fixed rate."
    tax_in: "Up to 1.5 lakh a year under Section 80C (old regime only)."
    tax_on_growth: "No tax while invested."
    tax_on_exit: "Gains above 1.25 lakh a year are taxed at 12.5% (long term); the 1.25 lakh exemption is shared with other equity gains."
    tax_label: "Deduction on entry, capital gains tax on exit"
    regime_benefit: old
    section: "80C"
    min_horizon_years: 5
    goal_types: [retirement, child_education, child_marriage, home, custom]
    watch_outs:
      - "Not for goals under 3 years: money cannot be withdrawn during the lock-in."
      - "Value can fall; only invest what your risk profile allows."
      - "Under the new regime there is no deduction, so a normal equity fund does the same job without a lock-in."

  - id: ssy
    name: "Sukanya Samriddhi Yojana (SSY)"
    kind: govt_scheme
    summary: "A government savings account for a girl child under 10, with an interest rate set every quarter."
    who_for: "Parents saving for a daughter's education or marriage."
    lock_in: "Account runs 21 years; partial withdrawal after 18 for education or marriage."
    risk: "Very low"
    liquidity: "Low"
    return_note: "8.2% a year for Oct-Dec 2026; resets every quarter."
    tax_in: "Deposits up to 1.5 lakh a year count toward Section 80C (old regime only)."
    tax_on_growth: "Interest is tax free."
    tax_on_exit: "Maturity amount is tax free."
    tax_label: "EEE"
    regime_benefit: old
    section: "80C"
    min_horizon_years: 10
    goal_types: [child_education, child_marriage]
    watch_outs:
      - "Only for a girl child; at most two accounts per family in most cases."
      - "Rate can change in later quarters."

  - id: scss
    name: "Senior Citizens' Savings Scheme (SCSS)"
    kind: govt_scheme
    summary: "A 5-year government deposit for people aged 60 and above, paying interest every quarter."
    who_for: "Retirees who want regular, low-risk income."
    lock_in: "5 years (extendable by 3 years)."
    risk: "Very low"
    liquidity: "Low"
    return_note: "8.2% a year for accounts opened in Oct-Dec 2026; the rate is fixed at opening."
    tax_in: "Deposits up to 1.5 lakh count toward Section 80C (old regime only)."
    tax_on_growth: "Interest is taxable at your slab rate; TDS applies above the threshold."
    tax_on_exit: "Principal returns without tax."
    tax_label: "Deduction on entry, interest taxable"
    regime_benefit: old
    section: "80C"
    min_horizon_years: 3
    goal_types: [retirement]
    watch_outs:
      - "Maximum deposit is 30 lakh per person."
      - "Submit Form 15H if your total tax is nil, to avoid TDS."

  - id: nsc
    name: "National Savings Certificate (NSC)"
    kind: govt_scheme
    summary: "A 5-year post office certificate with interest compounding annually and paid at maturity."
    who_for: "Medium goals (5+ years) for people who want a fixed rate known upfront."
    lock_in: "5 years."
    risk: "Very low"
    liquidity: "Low"
    return_note: "7.7% a year for Oct-Dec 2026; fixed for the certificate's life."
    tax_in: "Counts toward Section 80C (old regime only)."
    tax_on_growth: "Interest is taxable each year at slab rate, but the interest of the first four years also counts as reinvested under 80C."
    tax_on_exit: "Principal returns without tax."
    tax_label: "Deduction on entry, interest taxable"
    regime_benefit: old
    section: "80C"
    min_horizon_years: 5
    goal_types: [home, child_education, custom]
    watch_outs:
      - "Interest is taxable, so the after-tax return is lower for higher brackets."

  - id: kvp
    name: "Kisan Vikas Patra (KVP)"
    kind: govt_scheme
    summary: "A post office certificate that doubles money in a fixed period at a fixed rate."
    who_for: "Savers who want a fixed rate known upfront and no market risk."
    lock_in: "About 9 years 7 months, with early exit only after 2.5 years."
    risk: "Very low"
    liquidity: "Low"
    return_note: "7.5% a year; money doubles in 115 months."
    tax_in: "No deduction."
    tax_on_growth: "Interest is taxable at slab rate."
    tax_on_exit: "Principal returns without tax."
    tax_label: "No deduction, interest taxable"
    regime_benefit: none
    section: null
    min_horizon_years: 8
    goal_types: [custom]
    watch_outs:
      - "No tax benefit, so compare the after-tax return with other fixed-rate options."

  - id: post_office_td
    name: "Post office time deposit (1 to 5 years)"
    kind: bank
    summary: "A fixed deposit with the post office. The 5-year version counts toward Section 80C."
    who_for: "Short to medium goals that need a known amount on a known date."
    lock_in: "1 to 5 years (5-year deposit has the 80C benefit)."
    risk: "Very low"
    liquidity: "Medium"
    return_note: "Around 6.9% (1 year) to 7.5% (5 years) for Oct-Dec 2026."
    tax_in: "Only the 5-year deposit: Section 80C (old regime only)."
    tax_on_growth: "Interest is taxable each year at slab rate."
    tax_on_exit: "Principal returns without tax."
    tax_label: "Interest taxable"
    regime_benefit: old
    section: "80C"
    min_horizon_years: 1
    goal_types: [home, vehicle, travel, custom]
    watch_outs:
      - "Interest is taxed every year, even though you receive it only at maturity."

  - id: bank_fd
    name: "Bank fixed deposit"
    kind: bank
    summary: "A deposit that pays a fixed rate for a fixed term. A 5-year tax-saver version qualifies for Section 80C."
    who_for: "Short goals and emergency buffers where you need a known value."
    lock_in: "7 days to 10 years; tax-saver FD is locked for 5 years."
    risk: "Very low (deposit insurance covers up to 5 lakh per bank)"
    liquidity: "Medium (penalty on early exit)"
    return_note: "Varies by bank and term."
    tax_in: "Only the 5-year tax-saver FD gets Section 80C (old regime only)."
    tax_on_growth: "Interest is taxed each year at slab rate; TDS applies above 50,000 a year (1 lakh for seniors)."
    tax_on_exit: "Principal returns without tax."
    tax_label: "Interest taxable every year"
    regime_benefit: old
    section: "80C"
    min_horizon_years: 1
    goal_types: [emergency, vehicle, travel, home]
    watch_outs:
      - "In the 30% bracket the after-tax return can be below inflation."
      - "Submit Form 15G or 15H if no tax is due, to avoid TDS."

  - id: tax_free_bonds
    name: "Tax-free bonds"
    kind: bond
    summary: "Long-term bonds from government-linked issuers whose interest is exempt from tax. Mostly bought in the secondary market."
    who_for: "People in high brackets who want steady, long-dated income."
    lock_in: "10 to 20 years; can be sold on the exchange."
    risk: "Low (issuer risk) with price swings if sold early"
    liquidity: "Medium to low (thin trading)"
    return_note: "Market yield, often 5% to 6%; check the live price."
    tax_in: "No deduction."
    tax_on_growth: "Interest is tax free."
    tax_on_exit: "Selling above cost attracts capital gains tax."
    tax_label: "Interest exempt"
    regime_benefit: none
    section: null
    min_horizon_years: 8
    goal_types: [retirement]
    watch_outs:
      - "Few new issues; you buy from other investors at market price."
      - "Compare the yield with the pre-tax rate of a taxable option at your bracket."

  - id: sgb
    name: "Sovereign Gold Bonds (SGB)"
    kind: bond
    summary: "Government gold bonds that earn 2.5% interest on top of the gold price. New series are no longer issued; existing bonds trade on the exchange."
    who_for: "People who already want gold in their mix and can hold until maturity."
    lock_in: "8 years (exit possible after year 5 on set dates); exchange trading is possible."
    risk: "Medium (gold price)"
    liquidity: "Medium"
    return_note: "Gold price change plus 2.5% yearly interest."
    tax_in: "No deduction."
    tax_on_growth: "The 2.5% interest is taxable at slab rate."
    tax_on_exit: "Gain on redemption at maturity by the original buyer is tax free; selling on the exchange is taxed as capital gains."
    tax_label: "Maturity gain exempt for original holders"
    regime_benefit: none
    section: null
    min_horizon_years: 5
    goal_types: [custom]
    watch_outs:
      - "Tax-free maturity applies only if the original subscriber holds to maturity."

  - id: term_insurance
    name: "Term life insurance"
    kind: insurance
    summary: "Pure life cover: if the insured dies in the term, the family receives the sum assured."
    who_for: "Anyone with dependents, loans or financial goals that others would carry."
    lock_in: "None, but premiums must be paid for the term."
    risk: "Not an investment"
    liquidity: "Not applicable"
    return_note: "No maturity value."
    tax_in: "Premium counts toward Section 80C (old regime only)."
    tax_on_growth: "Not applicable."
    tax_on_exit: "Death benefit is tax free."
    tax_label: "Premium deduction (old regime), payout tax free"
    regime_benefit: old
    section: "80C"
    min_horizon_years: 1
    goal_types: [emergency]
    watch_outs:
      - "Buy it for protection first; the tax deduction is a side benefit."
      - "Disclose health and habits honestly so claims are not disputed."

  - id: health_insurance
    name: "Health insurance (self, family and parents)"
    kind: insurance
    summary: "Pays hospital bills up to the sum insured. A family floater covers spouse and children under one policy."
    who_for: "Everyone; parents can be covered under a separate policy."
    lock_in: "Yearly renewal."
    risk: "Not an investment"
    liquidity: "Not applicable"
    return_note: "No maturity value."
    tax_in: "Section 80D: up to 25,000 for self and family (50,000 if senior), plus up to 25,000 for parents (50,000 if senior); maximum 1 lakh (old regime only)."
    tax_on_growth: "Not applicable."
    tax_on_exit: "Claim payout is not taxed."
    tax_label: "Premium deduction (old regime)"
    regime_benefit: old
    section: "80D"
    min_horizon_years: 1
    goal_types: [emergency]
    watch_outs:
      - "Preventive check-ups up to 5,000 fall within the same limit."
      - "Pay by non-cash modes to claim the deduction."

  - id: ulip
    name: "Unit Linked Insurance Plan (ULIP)"
    kind: insurance
    summary: "Insurance and market investment in one product, with charges that reduce returns in early years."
    who_for: "People who have already filled simpler options and understand the charges."
    lock_in: "5 years minimum."
    risk: "Medium to high (market-linked)"
    liquidity: "Low"
    return_note: "Market-linked, after charges."
    tax_in: "Premium may count toward Section 80C (old regime only)."
    tax_on_growth: "No tax while invested."
    tax_on_exit: "Maturity is tax free only if yearly premium is within 2.5 lakh (total across policies); above that, gains are taxed like equity funds."
    tax_label: "Conditional exemption"
    regime_benefit: old
    section: "80C"
    min_horizon_years: 10
    goal_types: [retirement]
    watch_outs:
      - "Compare total charges with a term plan plus a low-cost index or equity fund."

  - id: equity_fund
    name: "Equity mutual funds (large, flexi, mid, small cap, index)"
    kind: mutual_fund
    summary: "Pooled money invested mostly in shares. Returns vary with the market."
    who_for: "Goals 5 or more years away for people who can ride out falls of 20% or more."
    lock_in: "None (exit load may apply in the first year)."
    risk: "High"
    liquidity: "High"
    return_note: "Market-linked; this planner assumes 11% a year for planning, not a promise."
    tax_in: "No deduction (except ELSS under the old regime)."
    tax_on_growth: "No tax while invested."
    tax_on_exit: "Held more than 12 months: 12.5% on gains above 1.25 lakh a year. Sold sooner: 20%."
    tax_label: "Capital gains tax on exit"
    regime_benefit: none
    section: null
    min_horizon_years: 5
    goal_types: [retirement, child_education, home, custom]
    watch_outs:
      - "Selling within 12 months raises tax from 12.5% to 20%."
      - "The 1.25 lakh exemption resets every April, which makes yearly gain harvesting possible."

  - id: debt_fund
    name: "Debt mutual funds (liquid, short duration, corporate bond, banking and PSU)"
    kind: mutual_fund
    summary: "Pooled money lent to governments and companies. Smaller swings than equity but not risk free."
    who_for: "Goals 1 to 5 years away, and the steady part of a longer portfolio."
    lock_in: "None."
    risk: "Low to medium"
    liquidity: "High"
    return_note: "Roughly 6% to 7.5% in recent years; not a promise."
    tax_in: "No deduction."
    tax_on_growth: "No tax while invested."
    tax_on_exit: "Units bought on or after 1 April 2023: gains are taxed at your slab rate, whatever the holding period."
    tax_label: "Gains taxed at slab rate"
    regime_benefit: none
    section: null
    min_horizon_years: 1
    goal_types: [home, vehicle, travel, emergency, child_education]
    watch_outs:
      - "No lower rate for long holding any more, so the after-tax edge over a bank FD is mainly deferral and convenience."
      - "Credit-risk funds can lose value if a borrower defaults."

  - id: arbitrage_fund
    name: "Arbitrage funds"
    kind: mutual_fund
    summary: "Funds that earn from price gaps between cash and futures markets. Returns are close to short-term debt."
    who_for: "Money needed in 1 to 3 years for people in the 20% and 30% brackets."
    lock_in: "None (exit load may apply for a few weeks)."
    risk: "Low"
    liquidity: "High"
    return_note: "Usually close to liquid fund returns."
    tax_in: "No deduction."
    tax_on_growth: "No tax while invested."
    tax_on_exit: "Taxed as equity: held more than 12 months, 12.5% above 1.25 lakh; sooner, 20%."
    tax_label: "Equity taxation"
    regime_benefit: none
    section: null
    min_horizon_years: 1
    goal_types: [home, vehicle, travel, emergency]
    watch_outs:
      - "Held under 12 months, the 20% rate can be worse than slab for people in the 5% to 15% brackets."
      - "Returns dip when arbitrage opportunities are thin."

  - id: gold_fund
    name: "Gold funds and gold ETFs"
    kind: mutual_fund
    summary: "A way to hold gold without buying coins or bars. Gold ETFs trade like shares and need a demat account; gold funds of funds do not."
    who_for: "A small slice (5% to 10%) of a long-term portfolio for diversification."
    lock_in: "None."
    risk: "Medium to high"
    liquidity: "High"
    return_note: "Follows the gold price; no income."
    tax_in: "No deduction."
    tax_on_growth: "No tax while invested."
    tax_on_exit: "Gold ETFs: held more than 12 months, 12.5%; sooner, slab rate. Gold funds of funds: more than 24 months, 12.5%; sooner, slab rate."
    tax_label: "12.5% after the holding period"
    regime_benefit: none
    section: null
    min_horizon_years: 3
    goal_types: [retirement, custom]
    watch_outs:
      - "No 1.25 lakh exemption for gold gains."
      - "Gold can stay flat for years."

  - id: international_fund
    name: "International funds"
    kind: mutual_fund
    summary: "Funds that invest in overseas shares, usually through a fund of funds."
    who_for: "Long goals for people who already hold domestic equity and want some foreign exposure."
    lock_in: "None."
    risk: "High"
    liquidity: "Medium (fresh subscriptions are sometimes capped)"
    return_note: "Market and currency linked."
    tax_in: "No deduction."
    tax_on_growth: "No tax while invested."
    tax_on_exit: "Held more than 24 months: 12.5%; sooner: slab rate. No 1.25 lakh exemption."
    tax_label: "12.5% after 24 months"
    regime_benefit: none
    section: null
    min_horizon_years: 5
    goal_types: [retirement, child_education]
    watch_outs:
      - "This planner does not include international funds in its shortlist."

  - id: reit_invit
    name: "REITs and InvITs"
    kind: market
    summary: "Listed vehicles that own rent-earning property or infrastructure and pass most income to unit holders."
    who_for: "People who understand market-traded income products."
    lock_in: "None; units trade on the exchange."
    risk: "Medium to high"
    liquidity: "Medium"
    return_note: "Distributions plus unit price changes."
    tax_in: "No deduction."
    tax_on_growth: "Distributions can be part interest (slab rate), part dividend (slab rate) and part return of capital."
    tax_on_exit: "Listed units held more than 12 months: 12.5% above exemption limits; sooner: 20%."
    tax_label: "Mixed"
    regime_benefit: none
    section: null
    min_horizon_years: 5
    goal_types: [custom]
    watch_outs:
      - "Tax on each distribution depends on its source; read the issuer's tax statement."

  - id: direct_stocks
    name: "Direct shares"
    kind: market
    summary: "Buying shares of companies yourself through a broker."
    who_for: "People who can research companies and accept large swings."
    lock_in: "None."
    risk: "Very high"
    liquidity: "High"
    return_note: "Market-linked."
    tax_in: "No deduction."
    tax_on_growth: "Dividends are taxed at slab rate."
    tax_on_exit: "Held more than 12 months: 12.5% above 1.25 lakh; sooner: 20%. Securities transaction tax applies on trades."
    tax_label: "Capital gains tax on exit"
    regime_benefit: none
    section: null
    min_horizon_years: 5
    goal_types: [custom]
    watch_outs:
      - "The 1.25 lakh exemption is shared with equity fund gains."

  - id: fifty_four_ec
    name: "Capital gain bonds (Section 54EC)"
    kind: bond
    summary: "Bonds from specified issuers that let you save tax on long-term gains from land or buildings if you invest within 6 months."
    who_for: "People who sold land or a building at a long-term gain."
    lock_in: "5 years."
    risk: "Very low (issuer risk)"
    liquidity: "Very low"
    return_note: "Lower than most fixed-rate options; interest is taxable."
    tax_in: "Exempts long-term gain on land or buildings up to 50 lakh in a year."
    tax_on_growth: "Interest is taxable at slab rate."
    tax_on_exit: "Principal returns after 5 years."
    tax_label: "Capital gain exemption"
    regime_benefit: both
    section: null
    min_horizon_years: 5
    goal_types: [custom]
    watch_outs:
      - "Applies only to gains on land or buildings, not to shares or mutual funds."
      - "Must be invested within 6 months of the sale."
