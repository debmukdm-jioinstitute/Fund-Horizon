name: Factsheet Links (browser)

# Some publishers only show their factsheet list in a real browser. This job reads those pages with headless Chromium
# (Playwright) and commits the links to data/factsheet_links/browser.json, which the API's factsheet collector ingests.
on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: factsheets-browser
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies and Chromium
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt playwright
          playwright install --with-deps chromium

      - name: Collect factsheet links
        run: python backend/scripts/scrape_factsheets_browser.py

      - name: Commit changed links
        run: |
          git config user.name "fh-data-bot"
          git config user.email "fh-data-bot@users.noreply.github.com"
          git add data/factsheet_links/browser.json
          git diff --cached --quiet || (git commit -m "data: factsheet links refresh" && git pull --rebase origin main && git push)
