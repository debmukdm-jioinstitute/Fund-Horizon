# Fund Screening thresholds, windows, ratio catalog, and funnel defaults
min_tenure_years: 3
# Categories the job must cover >= 90% (see jobs.check_coverage); debt/liquid are scored but not gated
equity_categories: [flexi_cap, large_cap, mid_cap, small_cap, large_mid_cap, multi_cap, focused, value, contra, dividend_yield, elss]
risk_window_years: 3
capture_window_years: 2
quartile_window_years: 2

default_columns:
  - sharpe
  - sortino
  - up_capture
  - down_capture
  - expense_ratio

ratios:
  - key: alpha
    label: "Jensen's Alpha"
    unit: pct
    description: "Annualized excess return above CAPM expectation"
  - key: beta
    label: "Beta"
    unit: decimal
    description: "Sensitivity to category benchmark"
  - key: std_dev
    label: "Standard Deviation"
    unit: pct
    description: "Annualized return volatility"
  - key: r_squared
    label: "R-Squared"
    unit: decimal
    description: "Coefficient of determination vs benchmark"
  - key: information_ratio
    label: "Information Ratio"
    unit: decimal
    description: "Excess return per unit of tracking error"
  - key: tracking_error
    label: "Tracking Error"
    unit: pct
    description: "Annualized standard deviation of excess returns"
  - key: treynor
    label: "Treynor Ratio"
    unit: decimal
    description: "Excess return over risk-free rate per unit of beta"
  - key: sharpe
    label: "Sharpe Ratio"
    unit: decimal
    description: "Excess return over risk-free rate per unit of total risk"
  - key: sortino
    label: "Sortino Ratio"
    unit: decimal
    description: "Excess return over risk-free rate per unit of downside risk"
  - key: up_capture
    label: "Up Capture"
    unit: ratio
    description: "Performance in positive benchmark months (>1 means outperforming up market)"
  - key: down_capture
    label: "Down Capture"
    unit: ratio
    description: "Performance in negative benchmark months (<1 means protecting capital)"
  - key: max_drawdown
    label: "Max Drawdown"
    unit: pct
    description: "Worst peak-to-trough drop"
  - key: expense_ratio
    label: "Regular TER"
    unit: pct
    description: "Regular plan Total Expense Ratio (%)"

# Calibrated to the 3Y window ending Oct 2026: flexi-cap Sharpe medians ~0.3 (max ~0.6), so >= 1 selects nothing.
# Capture bounds are vs the category-median benchmark, so >100% up / <100% down is almost only Q1 funds.
bounds_defaults:
  sharpe:
    min: 0.2
  sortino:
    min: 0.2
  up_capture:
    min: 0.9
  down_capture:
    max: 1.1
  tenure_ratio:
    min: 1.0

quartiles:
  action: [2, 3]
  retain: 1
  min_peers: 8

# Composite pick score weights (z-scored across funnel survivors)
score_weights:
  sharpe: 1.0
  sortino: 1.0
  capture_spread: 1.0
  roll_consistency: 1.0

presets:
  - id: builtin-core-flexi-cap
    name: "Core Flexi Cap"
    filters:
      cat: flexi_cap
  - id: builtin-large-cap-defensive
    name: "Large Cap Defensive"
    filters:
      cat: large_cap
      bounds:
        sharpe:
          min: 0.0
        sortino:
          min: 0.0
        down_capture:
          max: 1.0
